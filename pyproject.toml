[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "begin-agent"
version = "0.1.0"
description = "多租户、多 Agent 平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3,<3",
  "jsonschema>=4,<5",
  "pyyaml>=6,<7",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2,<3",
  "sqlalchemy[asyncio]>=2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
begin-agent-api = "app.api.main:run"
begin-agent-worker = "app.workers.agent_worker:run"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
