services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-begin_agent}
      POSTGRES_USER: ${POSTGRES_USER:-begin_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-begin_agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-begin_agent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      AGENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-begin_agent}:${POSTGRES_PASSWORD:-begin_agent}@postgres:5432/${POSTGRES_DB:-begin_agent}
    command: python -m app.api.main
    ports:
      - "8000:8000"
    volumes:
      - model_credentials:/workspace/.data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      AGENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-begin_agent}:${POSTGRES_PASSWORD:-begin_agent}@postgres:5432/${POSTGRES_DB:-begin_agent}
    command: python -m app.workers.agent_worker
    volumes:
      - model_credentials:/workspace/.data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  model_credentials:
